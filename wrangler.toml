# =========================================================
# BILLION PIXEL CANVAS
# CLOUDFLARE WORKER CONFIGURATION
# =========================================================

name = "billion-pixel-canvas"

main = "src/index.js"

compatibility_date = "2026-08-31"


# =========================================================
# WORKER
# =========================================================

workers_dev = true


# =========================================================
# ENVIRONMENT VARIABLES
# =========================================================
#
# DO NOT put private keys, seed phrases or passwords here.
#
# The Bitcoin receiving address is public and can safely be
# configured as an environment variable.
#

[vars]

PUBLIC_ORIGIN = "https://YOUR-PAGES-DOMAIN.pages.dev"

BTC_RECEIVING_ADDRESS = "bc1qk8ehysk2fthd2p07zgdqz84tyvudkdn4565u40"

BITCOIN_API_BASE = "https://mempool.space/api"


# =========================================================
# D1 DATABASE
# =========================================================

[[d1_databases]]

binding = "DB"

database_name = "billion-pixel-canvas"

database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

migrations_dir = "migrations"


# =========================================================
# KV — RATE LIMITING
# =========================================================

[[kv_namespaces]]

binding = "RATE_LIMIT"

id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"


# =========================================================
# CRON
# =========================================================
#
# Every 5 minutes:
#
# - check pending Bitcoin payments
# - process confirmations
# - complete paid orders
# - release expired reservations
# - clean expired sessions/tokens
#

[triggers]

crons = [
    "*/5 * * * *"
]


# =========================================================
# OBSERVABILITY
# =========================================================

[observability]

enabled = true
